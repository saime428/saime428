<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190" role="img" aria-labelledby="title desc">
  <title id="title">Animated project cards</title>
  <desc id="desc">Five gently floating cards: agent core with 988 tests, DreamLoop on PyPI and GHCR, the usage tray, fxlab web motion, and seven merged upstream pull requests.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="shine" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1100" height="190" rx="18" fill="#0D1117"/>

  <g transform="translate(18 18)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.8s" repeatCount="indefinite"/>
    <rect width="200" height="150" rx="16" fill="url(#surface)" stroke="#334155"/>
    <rect width="200" height="150" rx="16" fill="url(#shine)" opacity=".5"/>
    <rect x="18" y="22" width="54" height="54" rx="14" fill="#A78BFA"/>
    <text x="29" y="57" fill="#0D1117" font-family="ui-monospace, monospace" font-size="21" font-weight="700">&gt;_</text>
    <text x="18" y="110" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="17" font-weight="700">AGENT CORE</text>
    <text x="18" y="132" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">988 TESTS / MCP RUNTIME</text>
    <circle cx="176" cy="128" r="4" fill="#A78BFA" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
  </g></g>

  <g transform="translate(234 18)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 -4;0 4;0 -4" dur="4.4s" begin="-.8s" repeatCount="indefinite"/>
    <rect width="200" height="150" rx="16" fill="url(#surface)" stroke="#334155"/>
    <rect width="200" height="150" rx="16" fill="url(#shine)" opacity=".5"/>
    <circle cx="45" cy="49" r="27" fill="#6366F1"/>
    <circle cx="43" cy="49" r="16" fill="#F8FAFC"/>
    <circle cx="51" cy="44" r="14" fill="#6366F1"/>
    <text x="18" y="110" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="17" font-weight="700">DREAMLOOP</text>
    <text x="18" y="132" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">PyPI + GHCR / 91% COV</text>
    <circle cx="176" cy="128" r="4" fill="#818CF8" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="2s" begin="-.4s" repeatCount="indefinite"/></circle>
  </g></g>

  <g transform="translate(450 18)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.6s" begin="-1.6s" repeatCount="indefinite"/>
    <rect width="200" height="150" rx="16" fill="url(#surface)" stroke="#334155"/>
    <rect width="200" height="150" rx="16" fill="url(#shine)" opacity=".5"/>
    <rect x="18" y="22" width="54" height="54" rx="14" fill="#5391FE"/>
    <rect x="29" y="52" width="7" height="14" rx="2" fill="#F8FAFC"/>
    <rect x="41" y="42" width="7" height="24" rx="2" fill="#F8FAFC"/>
    <rect x="53" y="33" width="7" height="33" rx="2" fill="#F8FAFC"/>
    <text x="18" y="110" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="17" font-weight="700">USAGE TRAY</text>
    <text x="18" y="132" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">CLAUDE / CODEX QUOTA</text>
    <circle cx="176" cy="128" r="4" fill="#60A5FA" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="1.7s" begin="-.9s" repeatCount="indefinite"/></circle>
  </g></g>

  <g transform="translate(666 18)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 -5;0 5;0 -5" dur="4.2s" begin="-2.4s" repeatCount="indefinite"/>
    <rect width="200" height="150" rx="16" fill="url(#surface)" stroke="#334155"/>
    <rect width="200" height="150" rx="16" fill="url(#shine)" opacity=".5"/>
    <rect x="18" y="22" width="54" height="54" rx="14" fill="#F472B6"/>
    <path d="M28 49c5-12 9-12 14 0s9 12 14 0" fill="none" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round"/>
    <text x="18" y="110" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="17" font-weight="700">FXLAB</text>
    <text x="18" y="132" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">ZERO-DEPS WEB MOTION</text>
    <circle cx="176" cy="128" r="4" fill="#F9A8D4" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="2.1s" begin="-1.2s" repeatCount="indefinite"/></circle>
  </g></g>

  <g transform="translate(882 18)"><g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" begin="-3s" repeatCount="indefinite"/>
    <rect width="200" height="150" rx="16" fill="url(#surface)" stroke="#334155"/>
    <rect width="200" height="150" rx="16" fill="url(#shine)" opacity=".5"/>
    <circle cx="45" cy="49" r="27" fill="#34D399"/>
    <path d="M36 40v18M36 51h8a6 6 0 0 0 6-6v-1" fill="none" stroke="#0D1117" stroke-width="3" stroke-linecap="round"/>
    <circle cx="36" cy="36" r="4.5" fill="#0D1117"/>
    <circle cx="36" cy="62" r="4.5" fill="#0D1117"/>
    <circle cx="56" cy="40" r="4.5" fill="#0D1117"/>
    <text x="18" y="110" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="17" font-weight="700">OPEN SOURCE</text>
    <text x="18" y="132" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">7 PRs MERGED UPSTREAM</text>
    <circle cx="176" cy="128" r="4" fill="#6EE7B7" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" begin="-.6s" repeatCount="indefinite"/></circle>
  </g></g>
</svg>
