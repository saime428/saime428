<svg xmlns="http://www.w3.org/2000/svg" width="520" height="210" viewBox="0 0 520 210" role="img" aria-labelledby="title desc">
  <title id="title">Codex usage widget</title>
  <desc id="desc">Animated card for a lightweight Windows Codex usage widget.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#0C4A6E"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#BAE6FD"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="520" height="210" rx="18" fill="url(#bg)"/>
  <path d="M0 184C100 138 180 222 276 174S414 135 520 166" fill="none" stroke="#38BDF8" stroke-opacity=".16"/>
  <text x="32" y="46" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">PROJECT / 02</text>
  <text x="32" y="86" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="25" font-weight="700">CODEX WIDGET</text>
  <text x="32" y="115" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="13">LIGHTWEIGHT WINDOWS COMPANION</text>
  <text x="32" y="139" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12">local usage signal / always within reach</text>
  <g transform="translate(356 45)">
    <rect width="128" height="104" rx="13" fill="#020617" fill-opacity=".55" stroke="#38BDF8" stroke-opacity=".28"/>
    <text x="15" y="24" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="10">LIVE_USAGE</text>
    <rect x="15" y="76" width="13" height="12" rx="3" fill="url(#bar)"><animate attributeName="height" values="12;35;12" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="76;53;76" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="37" y="61" width="13" height="27" rx="3" fill="url(#bar)"><animate attributeName="height" values="27;53;27" dur="2.4s" begin="-.7s" repeatCount="indefinite"/><animate attributeName="y" values="61;35;61" dur="2.4s" begin="-.7s" repeatCount="indefinite"/></rect>
    <rect x="59" y="47" width="13" height="41" rx="3" fill="url(#bar)"><animate attributeName="height" values="41;20;41" dur="1.9s" begin="-1.3s" repeatCount="indefinite"/><animate attributeName="y" values="47;68;47" dur="1.9s" begin="-1.3s" repeatCount="indefinite"/></rect>
    <rect x="81" y="67" width="13" height="21" rx="3" fill="url(#bar)"><animate attributeName="height" values="21;48;21" dur="2.2s" begin="-.3s" repeatCount="indefinite"/><animate attributeName="y" values="67;40;67" dur="2.2s" begin="-.3s" repeatCount="indefinite"/></rect>
    <circle cx="108" cy="20" r="4" fill="#34D399" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>
  <text x="32" y="190" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="10">POWERSHELL / WINDOWS</text>
</svg>
