<svg xmlns="http://www.w3.org/2000/svg" width="520" height="210" viewBox="0 0 520 210" role="img" aria-labelledby="title desc">
  <title id="title">DreamLoop</title>
  <desc id="desc">Animated card for a local-first AI dream journal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0F172A"/><stop offset="1" stop-color="#312E81"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="520" height="210" rx="18" fill="url(#bg)"/>
  <circle cx="435" cy="48" r="74" fill="#8B5CF6" opacity=".11"/>
  <circle cx="435" cy="48" r="48" fill="none" stroke="#C4B5FD" stroke-opacity=".25" stroke-dasharray="5 8"><animateTransform attributeName="transform" type="rotate" from="0 435 48" to="360 435 48" dur="16s" repeatCount="indefinite"/></circle>
  <circle cx="435" cy="48" r="10" fill="#C4B5FD" filter="url(#glow)"><animate attributeName="r" values="8;13;8" dur="2.5s" repeatCount="indefinite"/></circle>
  <text x="32" y="46" fill="#A5F3FC" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">PROJECT / 01</text>
  <text x="32" y="86" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="27" font-weight="700">DREAMLOOP</text>
  <text x="32" y="115" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="13">LOCAL-FIRST AI DREAM JOURNAL</text>
  <text x="32" y="139" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12">pattern discovery / Ollama / private by default</text>
  <path d="M32 175h22l8-18 12 31 14-46 13 33 11-18h27" fill="none" stroke="url(#wave)" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0 180;180 0;0 180" dur="3.6s" repeatCount="indefinite"/>
  </path>
  <circle cx="476" cy="175" r="5" fill="#5EEAD4"><animate attributeName="opacity" values="1;.25;1" dur="1.7s" repeatCount="indefinite"/></circle>
  <text x="454" y="197" fill="#99F6E4" font-family="ui-monospace, monospace" font-size="10">PYTHON</text>
</svg>
