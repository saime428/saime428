<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
  <title id="title">saime428 profile header</title>
  <desc id="desc">A dark technical header with animated orbital lines.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#93C5FD" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="260" rx="18" fill="url(#background)"/>
  <rect width="1100" height="260" rx="18" fill="url(#grid)"/>
  <path d="M0 210 C220 165 365 285 595 215 S900 135 1100 196" fill="none" stroke="url(#accent)" stroke-opacity=".28" stroke-width="1"/>
  <path d="M0 230 C250 188 430 286 660 226 S930 170 1100 215" fill="none" stroke="#38BDF8" stroke-opacity=".12" stroke-width="1"/>

  <g transform="translate(872 130)" fill="none" stroke="url(#accent)">
    <circle r="72" stroke-opacity=".18" stroke-width="1"/>
    <circle r="45" stroke-opacity=".3" stroke-width="1" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#A78BFA" fill-opacity=".9" stroke="none" filter="url(#glow)">
      <animate attributeName="r" values="10;14;10" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="72" cy="0" r="4" fill="#38BDF8" stroke="none" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-45" cy="0" r="3" fill="#FDE68A" stroke="none">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="74" fill="#93C5FD" font-size="13" letter-spacing="3">PERSONAL BUILD LOG / 2026</text>
    <text x="72" y="132" fill="#F8FAFC" font-size="49" font-weight="700" letter-spacing="-2">saime428</text>
    <text x="72" y="168" fill="#CBD5E1" font-size="16">LOCAL-FIRST AI  ·  AGENT WORKFLOWS  ·  CREATIVE TOOLS</text>
    <circle cx="78" cy="210" r="5" fill="#34D399">
      <animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="94" y="215" fill="#94A3B8" font-size="13">SYSTEM ONLINE — BUILDING IN PUBLIC</text>
    <rect x="404" y="202" width="8" height="16" fill="#93C5FD">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
